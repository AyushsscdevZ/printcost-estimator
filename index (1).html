    // Update calculated fields in place on input
    function update() {
      const it = cur_();
      if (!it || it.na) return;
      const c = calc(it);
      document.querySelectorAll('#det [data-v]').forEach(e => {
        const k = e.dataset.v;
        const v = c[k] !== undefined ? c[k] : get(it.f, k);
        e.textContent = fmt(v, +e.dataset.d || 0);
      });
      summary();
      renderList();
    }

    // --- RENDER ITEMS LIST ---
    function renderList() {
      const s = ($('#srch').value || '').toLowerCase();
      let tot = 0;
      let costedCount = 0;
      let naCount = 0;

      items.forEach(it => {
        if (!it.na) {
          const c = calc(it);
          tot += c.final * (it.annual || it.f.qty);
          costedCount++;
        } else {
          naCount++;
        }
      });

      $('#tot').textContent = `Total tender cost: ₹${fmt(tot, 0)}`;
      $('#itemCount').textContent = items.length ? `${items.length} items (${costedCount} costed, ${naCount} NA)` : '0 items';

      if (!items.length) {
        $('#list').innerHTML = `
    <div style="padding:24px 14px;text-align:center;color:var(--mu);font-size:12.5px">
      No items loaded.<br>Upload a tender Excel or click "+ Item".
    </div>`;
        return;
      }

      $('#list').innerHTML = items.map((it, i) => ({ it, i }))
        .filter(({ it }) => (it.name + ' ' + (it.cat || '') + ' ' + (it.co || '')).toLowerCase().includes(s))
        .map(({ it, i }) => {
          const c = it.na ? null : calc(it);
          return `<div class="it ${i === cur ? 'on' : ''}" data-i="${i}">
        <span class="n">${it.n}</span>
        <div class="t">
          <b>${esc(it.name)}</b>
          <span>${it.na ? esc(it.naWhy) : (TYPES[it.type] || 'Item') + ' · ' + fmt(it.f.qty) + ' pcs'}</span>
        </div>
        ${it.na ? '<span class="na">NA</span>' : `<span class="r">₹${fmt(c.final, 2)}</span>`}
      </div>`;
        }).join('');
    }

    // --- COSTING ASSISTANT BOT ---
    function msg(sender, text) {
      const d = document.createElement('div');
      d.className = 'm ' + sender;
      d.textContent = text;
      $('#msgs').append(d);
      $('#msgs').scrollTop = 1e9;
    }

    // Natural language query processor
    function cmd(text) {
      const l = text.toLowerCase().trim();
      const num = (l.match(/(\d+(?:\.\d+)?)/g) || []).map(Number);
      const itM = l.match(/item\s*(\d+)/i);
      const target = itM ? items.filter(i => i.n === +itM[1]) : items;

      // Set profit
      let m;
      if ((m = l.match(/profit.*?(\d+(?:\.\d+)?)/i))) {
        const val = +m[1];
        target.forEach(i => i.f.profit = val);
        return `Profit markup set to ${val}% for ${itM ? 'item ' + itM[1] : 'all items'}.`;
      }

      // Paper rate change
      const foundPaper = PAPERS.find(p => l.includes(p.toLowerCase()) || l.includes(p.toLowerCase().replace(' paper', '')));
      if (foundPaper && /rate|price/i.test(l) && num.length) {
        const val = num[num.length - 1];
        S.rates[foundPaper] = val;
        items.forEach(i => {
          [i.f, i.f.s0, i.f.s1].forEach(x => {
            if (x && x.paper === foundPaper) x.rate = val;
          });
        });
        return `${foundPaper} rate set to ₹${val}/kg for all items.`;
      }

      // Plate rate
      if (/plate\s*rate/i.test(l) && num.length) {
        const val = num[num.length - 1];
        S.plateRate = val;
        items.forEach(i => {
          [i.f, i.f.s0, i.f.s1].forEach(x => {
            if (x && 'plateRate' in x) x.plateRate = val;
          });
        });
        return `Plate rate updated to ₹${val}/plate for all items.`;
      }

      // Printing rate
      if (/print(ing)?\s*rate/i.test(l) && num.length) {
        const val = num[num.length - 1];
        S.printRate = val;
        items.forEach(i => {
          [i.f, i.f.s0, i.f.s1].forEach(x => {
            if (x && 'printRate' in x) x.printRate = val;
          });
        });
        return `Printing rate updated to ₹${val} / 1000 sheets / color for all items.`;
      }

      // Wastage percentage or minimum sheets
      if (/wastage/i.test(l) && num.length) {
        const val = num[num.length - 1];
        if (l.includes('%') || val <= 20) {
          items.forEach(i => i.f.wPct = val);
          return `Wastage set to ${val}% for all items.`;
        } else {
          items.forEach(i => i.f.wMin = val);
          return `Minimum wastage sheets set to ${val} sheets for all items.`;
        }
      }

      // GSM
      if (/gsm/i.test(l) && itM && num.length > 1) {
        const val = num[num.length - 1];
        const x = BOOK(target[0].type) ? target[0].f.s0 : target[0].f;
        x.gsm = val;
        return `Item ${itM[1]} GSM set to ${val}.`;
      }

      // Divide by 12 toggle
      if (/divide by 12|monthly|annual/i.test(l)) {
        if (/annual/i.test(l)) {
          setDivideBy12(false);
          return `Switched to Full Annual Quantity mode.`;
        } else {
          setDivideBy12(true);
          return `Switched to Annual ÷ 12 (Monthly) mode.`;
        }
      }

      // Highest / costliest
      if (/highest|costliest|expensive|max rate/i.test(l)) {
        const costed = items.filter(i => !i.na);
        if (!costed.length) return 'No costed items found.';
        const best = [...costed].sort((a, b) => calc(b).final - calc(a).final)[0];
        return `Highest rate item: Item #${best.n} "${best.name}" at ₹${fmt(calc(best).final, 2)} (${TYPES[best.type]}).`;
      }

      // Lowest / cheapest
      if (/lowest|cheapest|minimum rate|least expensive/i.test(l)) {
        const costed = items.filter(i => !i.na);
        if (!costed.length) return 'No costed items found.';
        const best = [...costed].sort((a, b) => calc(a).final - calc(b).final)[0];
        return `Lowest rate item: Item #${best.n} "${best.name}" at ₹${fmt(calc(best).final, 2)} (${TYPES[best.type]}).`;
      }

      // Clear tender
      if (/clear|reset all|clean/i.test(l)) {
        clearTender();
        return `Tender cleared. Ready for new tender file.`;
      }

      // Export commands
      if (/export|download/i.test(l)) {
        if (/item/i.test(l)) {
          exportCurrentItemExcel();
          return `Exporting current item costing sheet...`;
        } else {
          exportTenderBOQExcel();
          return `Exporting full BOQ tender workbook with detail sheets...`;
        }
      }

      // Front & Back / Cellback print method
      if (/cell\s*back|front\s*back|front\s*&\s*back/i.test(l)) {
        const isFB = /front/i.test(l);
        const method = isFB ? 'frontback' : 'cellback';
        target.forEach(i => {
          i.f.pmethod = method;
          i.f.plates = calcPlates(i.f, i.type);
        });
        return `Print method set to ${isFB ? 'Front & Back' : 'Cellback'} for ${itM ? 'item ' + itM[1] : 'all items'}. Plates auto-recalculated.`;
      }

      return `I can help you:
• Change profit: "Set profit to 18% for all items" or "Item 4 profit 20"
• Change paper rates: "Change Maplitho rate to 62 for all items"
• Change plates or printing: "Set plate rate to 600", "Printing rate 220"
• Change print method: "Set to Cellback" or "Set to Front Back"
• Toggle quantity: "Divide by 12" or "Full annual"
• Find extremes: "Which item has highest rate?" or "Which is cheapest?"
• Download: "Export tender" or "Export item"`;
    }

    const send = () => {
      const v = $('#q').value.trim();
      if (!v) return;
      $('#q').value = '';
      msg('me', v);
      msg('bot', cmd(v));
      renderList();
      renderDet();
    };

    $('#go').onclick = send;
    $('#q').onkeydown = e => { if (e.key === 'Enter') send(); };

    // --- EVENT HANDLERS ---
    $('#list').onclick = e => {
      const d = e.target.closest('.it');
      if (d) {
        cur = +d.dataset.i;
        renderList();
        renderDet();
      }
    };

    $('#srch').oninput = renderList;

    $('#det').addEventListener('input', e => {
      const k = e.target.dataset.k;
      if (!k || e.target.tagName !== 'INPUT') return;
      const it = cur_();
      if (!it) return;

      const val = parseFloat(e.target.value) || 0;
      set(it.f, k, val);

      // If UPS changed on envelope, auto-adjust punching die default
      if (k === 'ups' && it.type === 'envelope') {
        it.f.punchDie = val <= 10 ? 1200 : 2100;
      }

      // If UPS or Product Size changed, auto-calculate overall paper size
      if (k === 'ups' || k === 'prodL' || k === 'prodW') {
        const pL = it.f.prodL, pW = it.f.prodW, u = it.f.ups;
        if (pL > 0 && pW > 0 && u > 0) {
          const full = calcPaperSize(pL, pW, u, it.type === 'envelope');
          it.f.L = full.L;
          it.f.W = full.W;
          const inL = document.querySelector('#det input[data-k="L"]');
          const inW = document.querySelector('#det input[data-k="W"]');
          if (inL) inL.value = full.L;
          if (inW) inW.value = full.W;
        }
      }

      // For booklet section PPS or Product Size changed
      if (k === 's0.pps' || k === 's1.pps' || k === 's0.prodL' || k === 's0.prodW' || k === 's1.prodL' || k === 's1.prodW') {
        const s = k.startsWith('s0') ? 's0' : 's1';
        const sec = it.f[s];
        if (sec && sec.prodL > 0 && sec.prodW > 0 && sec.pps > 0) {
          const full = calcPaperSize(sec.prodL, sec.prodW, sec.pps, false);
          sec.L = full.L;
          sec.W = full.W;
          const inL = document.querySelector(`#det input[data-k="${s}.L"]`);
          const inW = document.querySelector(`#det input[data-k="${s}.W"]`);
          if (inL) inL.value = full.L;
          if (inW) inW.value = full.W;
        }
      }

      // If Quantity or Printing Colors (c1, c2) changed, auto-recalculate plates
      if (k === 'qty' || k === 'c1' || k === 'c2') {
        it.f.plates = calcPlates(it.f, it.type);
        const inPlates = document.querySelector('#det input[data-k="plates"]');
        if (inPlates) inPlates.value = it.f.plates;
      }

      // Ensure paper size never exceeds maximum 28 x 40 inches
      if (k === 'L' || k === 'W' || k === 's0.L' || k === 's0.W' || k === 's1.L' || k === 's1.W') {
        const prefix = k.includes('.') ? k.split('.')[0] + '.' : '';
        const targetObj = prefix ? it.f[prefix.replace('.', '')] : it.f;
        if (targetObj && targetObj.L > 0 && targetObj.W > 0) {
          if (Math.min(targetObj.L, targetObj.W) > 28 || Math.max(targetObj.L, targetObj.W) > 40) {
            if (targetObj.L >= targetObj.W) {
              if (targetObj.L > 40) targetObj.L = 40;
              if (targetObj.W > 28) targetObj.W = 28;
            } else {
              if (targetObj.W > 40) targetObj.W = 40;
              if (targetObj.L > 28) targetObj.L = 28;
            }
            e.target.value = get(it.f, k);
          }
        }
      }

      update();
    });

    $('#det').addEventListener('change', e => {
      const it = cur_();
      if (!it) return;
      const k = e.target.dataset.k;
      if (e.target.id === 'pmethod') {
        it.f.pmethod = e.target.value;
        it.f.plates = calcPlates(it.f, it.type);
        renderDet();
        renderList();
      } else if (e.target.id === 'ptype') {
        it.type = e.target.value;
        const oldQty = it.f.qty;
        const oldProdL = it.f.prodL;
        const oldProdW = it.f.prodW;
        const oldMethod = it.f.pmethod;
        it.f = mk(it.type);
        it.f.qty = oldQty;
        if (oldMethod) it.f.pmethod = oldMethod;
        it.f.plates = calcPlates(it.f, it.type);
        if (oldProdL && oldProdW) {
          it.f.prodL = oldProdL;
          it.f.prodW = oldProdW;
          const full = calcPaperSize(oldProdL, oldProdW, it.f.ups || 1);
          it.f.L = full.L;
          it.f.W = full.W;
        }
        renderList();
        renderDet();
      } else if (k && e.target.tagName === 'SELECT') {
        set(it.f, k, e.target.value);
        set(it.f, k.replace('paper', 'rate'), S.rates[e.target.value] ?? 58);
        renderDet();
        renderList();
      }
    });

    $('#det').addEventListener('click', e => {
      const it = cur_();
      if (e.target.id === 'rst' && it) {
        const oldQty = it.f.qty;
        const oldProdL = it.f.prodL;
        const oldProdW = it.f.prodW;
        it.f = mk(it.type);
        it.f.qty = oldQty;
        it.f.plates = calcPlates(it.f, it.type);
        if (oldProdL && oldProdW) {
          it.f.prodL = oldProdL;
          it.f.prodW = oldProdW;
          const full = calcPaperSize(oldProdL, oldProdW, it.f.ups || 1);
          it.f.L = full.L;
          it.f.W = full.W;
        }
        renderDet();
        renderList();
        msg('bot', `Reset item #${it.n} to default parameters.`);
      }
      if (e.target.id === 'force' && it) {
        it.na = false;
        renderDet();
        renderList();
        msg('bot', `Item #${it.n} will now be costed.`);
      }
      if (e.target.id === 'detExpBtn') {
        exportCurrentItemExcel();
      }
      if (e.target.id === 'detNewBtn') {
        $('#add').click();
      }
    });

    $('#sum').addEventListener('click', e => {
      if (e.target.id === 'sumExpItem') exportCurrentItemExcel();
      if (e.target.id === 'sumExpAll') exportTenderBOQExcel();
      if (e.target.id === 'copySum') {
        const it = cur_();
        if (!it || it.na) return;
        const c = calc(it);
        const summaryText = `${it.n}. ${it.name} (${TYPES[it.type]})\nQty: ${fmt(it.f.qty)} pcs\nPer Pcs Cost: ₹${fmt(c.per, 2)}\nProfit: ${it.f.profit}%\nFinal Rate: ₹${fmt(c.final, 2)}`;
        navigator.clipboard.writeText(summaryText).then(() => {
          alert('Costing summary copied to clipboard!');
        });
      }
    });

    function newItem(o) {
      const type = o.type || 'letter';
      const f = mk(type);
      f.qty = o.qty || 1000;
      return {
        n: items.length + 1,
        type,
        f,
        qty0: f.qty,
        annual: (o.qty || 1000) * 12,
        name: 'Custom Item ' + (items.length + 1),
        spec: 'Standard 78 GSM Offset Printing',
        co: 'Custom',
        cat: 'Stationery',
        na: false,
        naWhy: '',
        ...o
      };
    }

    $('#add').onclick = () => {
      const item = newItem({ name: 'Custom Item #' + (items.length + 1), qty: 1000 });
      items.push(item);
      cur = items.length - 1;
      $('#tn').textContent = $('#tn').textContent === 'No Tender Loaded' ? 'Manual Estimate' : $('#tn').textContent;
      $('#tnDisplay').textContent = $('#tn').textContent;
      renderList();
      renderDet();
      msg('bot', `Created new custom item #${item.n}. Customize parameters in yellow cells.`);
    };

    // Clear current tender to accept fresh file
    function clearTender() {
      items = [];
      cur = 0;
      S.ab = null;
      S.originalWb = null;
      $('#tn').textContent = 'No Tender Loaded';
      $('#tnDisplay').textContent = 'No Tender Loaded';
      renderList();
      renderDet();
      msg('bot', 'Tender cleared. Drop any new BOQ Excel file to cost it.');
    }

    $('#clrBtn').onclick = clearTender;

    // Quantity Mode Switch (Monthly ÷ 12 vs Annual)
    function setDivideBy12(enabled) {
      S.divideBy12 = enabled;
      $('#modeDiv12').classList.toggle('active', enabled);
      $('#modeAnnual').classList.toggle('active', !enabled);

      items.forEach(it => {
        if (it.annual > 0) {
          it.f.qty = enabled ? Math.ceil(it.annual / 12) : it.annual;
          it.f.plates = calcPlates(it.f, it.type);
        }
      });
      renderList();
      renderDet();
    }

    $('#modeDiv12').onclick = () => setDivideBy12(true);
    $('#modeAnnual').onclick = () => setDivideBy12(false);

    // Chips quick action
    $('#chips').innerHTML = [
      'Set profit to 18% for all items',
      'Change Maplitho paper rate to 62 for all items',
      'Which item has the highest rate?',
      'Which item is the cheapest?',
      'Divide by 12',
      'Full annual'
    ].map(t => `<button class="chip">${t}</button>`).join('');

    $('#chips').onclick = e => {
      if (e.target.className === 'chip') {
        $('#q').value = e.target.textContent;
        send();
      }
    };

    // --- DYNAMIC TENDER PARSING & DETECTION ---
    function typeOf(s) {
      s = (s || '').toLowerCase();
      // Pads / slip books / forms / vouchers
      if (/pad\b|bill book|receipt|slip book|prescription|slip|writing pad/i.test(s)) return 'pads';
      if (/passbook|pass book/i.test(s)) return 'passbook';
      if (/voucher|credit|debit/i.test(s)) return 'voucher';
      if (/envelop|envelope|pouch/i.test(s)) return 'envelope';
      // Register / ledger / hardbound book -> 'multi'
      if (/register|ledger|gate pass|attendance|stock register|master dumping/i.test(s)) return 'multi';
      // Booklets / brochures / kits / agreement books / catalogues
      if (/booklet|brochure|kit\b|agreement|catalogue|catalog/i.test(s)) return 'booklet';
      // Application forms, letter heads, certificates, leaflets, single-sheet fliers, file covers, charts — treat as letter
      return 'letter';
    }

    function parsePaperType(raw) {
      const s = (raw || '').toLowerCase();
      if (/kraft/i.test(s)) return 'Kraft Paper';
      if (/art paper|art card|sinar|gloss art/i.test(s)) {
        return /matt/i.test(s) ? 'Art Paper Matt' : 'Art Paper Gloss';
      }
      if (/bond/i.test(s)) return 'Bond Paper';
      if (/ledger/i.test(s)) return 'Ledger Paper';
      if (/board/i.test(s)) return 'Board Paper';
      if (/maplitho|offset/i.test(s)) return 'Maplitho';
      return 'Maplitho';
    }

    // Parse colour string like "4+0", "1+1", "3+1", "4 + 4", "Single Colour" → {c1, c2}
    function parseColours(raw) {
      if (!raw) return null;
      const s = String(raw).trim();
      // "N+M" pattern
      const pm = s.match(/(\d+)\s*\+\s*(\d+)/);
      if (pm) return { c1: +pm[1], c2: +pm[2] };
      // single digit
      const sm2 = s.match(/^(\d+)$/);
      if (sm2) return { c1: +sm2[1], c2: 0 };
      // text patterns
      if (/single|1\s*col/i.test(s)) return { c1: 1, c2: 0 };
      if (/4.*col/i.test(s)) return { c1: 4, c2: 0 };
      return null;
    }

    function loadBOQData(rows, filename) {
      $('#tn').textContent = filename.replace(/\.xlsx?$/i, '');
      $('#tnDisplay').textContent = filename.replace(/\.xlsx?$/i, '');
      items = [];
      let assumed = 0;

      // Dynamically map column indices based on header row
      const header = (rows[0] || []).map(h => String(h || '').trim().toLowerCase());
      const colOf = patterns => {
        for (const p of patterns) {
          const idx = header.findIndex(h => h.includes(p));
          if (idx !== -1) return idx;
        }
        return -1;
      };

      // Standard BOQ columns
      const colSr = colOf(['item number', 'item no', 'sr.no', 'sl.no', 'sr no', 'sl no', 'sr', 's.no', 'serial']);
      const colProdId = colOf(['product id', 'prod id', 'item code', 'code', 'id']);
      const colItem = colOf(['item title', 'product name', 'item name', 'product title', 'title', 'particular', 'name']);
      const colCat = colOf(['category', 'catogery', 'categ', 'group', 'product type', 'type']);
      const colSize = colOf(['size', 'paper size', 'dimension']);
      const colColor = colOf(['color', 'colour', 'printing', 'print color', 'colour printing']);
      const colGSM = colOf(['gsm']);
      const colPaper = colOf(['paper type', 'paper', 'material', 'stock']);
      const colPages = colOf(['no. of pages', 'no of pages', 'pages', 'page', 'leaf']);
      const colFinish = colOf(['finishing', 'finish', 'remarks', 'remark', 'note', 'special']);
      const colUps = colOf(['ups', 'up per sheet']);
      const colMoqMin = colOf(['moq', 'moqq', 'min order', 'min qty', 'min']);
      const colMax = colOf(['max']);
      const colAnnual = colOf(['annual qty', 'estimated annual', 'annual quantity', 'annual', 'item quantity', 'order qty', 'quantity', 'qty']);
      const colCo = colOf(['consignee id', 'consignee', 'company', 'client', 'dept', 'vendor']);
      const colSpec = colOf(['item description', 'specification', 'spec', 'description', 'detail']);
      const colUom = colOf(['unit of measure', 'uom', 'unit']);

      rows.forEach((r, i) => {
        // Skip header row
        if (i === 0) return;

        // Support both item-name-in-col-2 (BOQ) and product-name-in-col-C (Kotak) layouts
        const itemName = String(
          (colItem !== -1 ? r[colItem] : '') ||
          r[3] || r[2] || ''
        ).trim();
        if (!itemName) return;

        const sr = (colSr !== -1 && r[colSr]) ? r[colSr] : items.length + 1;

        // Company / Vendor — optional; default to filename
        const co = String(
          (colCo !== -1 && r[colCo]) ? r[colCo] : ''
        ) || filename.replace(/\.xlsx?$/i, '');

        // Category for product-type detection
        const cat = String(
          (colCat !== -1 && r[colCat]) ? r[colCat] : r[2] || 'Stationery'
        );

        // Full specification text (the long descriptive text column)
        const spec = String(
          (colSpec !== -1 && r[colSpec]) ? r[colSpec] : r[4] || ''
        );

        // UOM
        const uom = String(
          (colUom !== -1 && r[colUom]) ? r[colUom] : 'Per Pcs'
        );

        // Size — prefer dedicated size col, fall back to spec/remarks parsing
        const rawSize = String(
          (colSize !== -1 && r[colSize]) ? r[colSize] : r[10] || ''
        ).replace(/"/g, '').trim();

        // GSM — from dedicated column first, then spec text
        const rawGsm = (colGSM !== -1 && r[colGSM]) ? +r[colGSM] : 0;

        // Paper Type — from dedicated column first, then spec text
        const rawPaper = (colPaper !== -1 && r[colPaper]) ? String(r[colPaper]) : '';

        // Colour — from dedicated column first, then spec text
        const rawColor = (colColor !== -1 && r[colColor]) ? String(r[colColor]) : '';

        // No. of Pages — from dedicated column
        const rawPages = (colPages !== -1 && r[colPages]) ? +r[colPages] || 0 : 0;

        // Finishing / special instructions
        const finishing = String(
          (colFinish !== -1 && r[colFinish]) ? r[colFinish] : ''
        );

        // Annual / Order Quantity
        const isAnnualCol = colAnnual !== -1 && /annual/i.test(header[colAnnual]);
        const rawQtyVal = (colAnnual !== -1 && r[colAnnual] !== undefined) ? r[colAnnual] : r[7];
        const rawMoqVal = (colMoqMin !== -1 && r[colMoqMin] !== undefined) ? r[colMoqMin] : r[6];
        const annual = parseFloat(String(rawQtyVal || '').replace(/,/g, '').trim()) || 0;
        const moq = parseFloat(String(rawMoqVal || '').replace(/,/g, '').trim()) || 0;

        // Ups
        const ups = String((colUps !== -1 && r[colUps]) ? r[colUps] : '');

        // Build a combined text for fallback detection
        const combined = [itemName, cat, spec, finishing, rawSize].join(' ');

        // ── Product-type detection ─────────────────────────────────────────────
        const type = typeOf(combined);

        // ── NA detection ──────────────────────────────────────────────────────────
        // Try size col first, then fall back to item name / spec text (strip inch marks first)
        const sizeRegex = /(\d+(?:\.\d+)?)\s*[xX×*]\s*(\d+(?:\.\d+)?)/;
        const smRaw = rawSize.match(sizeRegex);   // from dedicated size column
        const smName = itemName.replace(/[""″]/g, '').match(sizeRegex) ||
          spec.replace(/[""″]/g, '').match(sizeRegex);
        // For single-sheet items (envelope/letter/pads): if size column holds a full-sheet value
        // (≥18×22 inches), prefer the product size from item name / spec instead,
        // because envelope/letter sizes are small; size col likely holds the paper sheet size in that case.
        const smRawIsFullSheet = smRaw && ((+smRaw[1] >= 18 && +smRaw[2] >= 22) || (+smRaw[1] * +smRaw[2] >= 350));
        const isSmallProduct = !BOOK(type);
        const sm = (isSmallProduct && smRawIsFullSheet && smName) ? smName : (smRaw || smName);

        const isSample = /sample required/i.test(combined);
        const isTrading = /\btrading\b/i.test(combined);
        const isOfficeStationery = /\b(pen|pens|uniball|v7|v seven|ball pen|gel pen|ink|cartridge|toner|pointer stick|stapler|stapler pin|pins?|rubber band|eraser|sharpener|ruler|scale|tape|fevicol|scissors|marker|highlighter|whiteboard|duster|calculator|punching machine|punch machine|lamination sheet|lamination pouch|pvc sheet|cloth|velcro|polythene)\b/i.test(combined) && !/printed|register|book|folder|file cover|letter|pad|slip|envelope|leaflet|brochure/i.test(itemName);

        // User rule: "if there is no proper quantity a mentioned put na"
        const noProperQty = (annual <= 0 && moq <= 0);

        const na = isSample || isTrading || isOfficeStationery || noProperQty || (!sm && !rawSize && !spec && !BOOK(type));
        const naWhy = isSample ? 'Sample Required' :
          isTrading ? 'Trading Product' :
            isOfficeStationery ? 'Trading Product' :
              noProperQty ? 'No Quantity Specified' :
                'Sample Required';

        // ── Quantity ──────────────────────────────────────────────────────────────
        let q = annual > 0 ? annual : (moq > 0 ? moq : 0);
        // Only divide by 12 if the column was specifically an "Annual" quantity
        if (isAnnualCol && S.divideBy12 && annual > 0) {
          q = Math.ceil(annual / 12);
        }

        const f = mk(type);
        f.qty = q;

        // ── GSM ───────────────────────────────────────────────────────────────────
        let detectedGSM = rawGsm > 0 ? rawGsm : 0;
        if (!detectedGSM) {
          const gsmM = (spec + ' ' + finishing).match(/(\d{2,3})\s*GSM/i);
          detectedGSM = gsmM ? +gsmM[1] : (type === 'envelope' ? 100 : 78);
        }

        // ── Pages Detection ───────────────────────────────────────────────────────
        let detectedPages = rawPages > 0 ? rawPages : 0;
        if (!detectedPages) {
          const pgWordM = combined.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten)\s+hundred\s*pages?\b/i);
          if (pgWordM) {
            const wordMap = { one: 100, two: 200, three: 300, four: 400, five: 500, six: 600, seven: 700, eight: 800, nine: 900, ten: 1000 };
            detectedPages = wordMap[pgWordM[1].toLowerCase()] || 0;
          }
          if (!detectedPages) {
            const pgMultM = combined.match(/page\s*[:\-]?\s*(\d+)\s*[xX]\s*(\d+)\b/i);
            if (pgMultM) detectedPages = (+pgMultM[1]) * (+pgMultM[2]);
          }
          if (!detectedPages) {
            const pgDirectM = combined.match(/page\s*[:\-]?\s*(\d+)\b/i) || combined.match(/(\d+)\s*pages?\b/i);
            if (pgDirectM) detectedPages = +pgDirectM[1];
          }
        }

        // ── Paper type ────────────────────────────────────────────────────────────
        const detectedPaper = rawPaper ? parsePaperType(rawPaper) : parsePaperType(spec + ' ' + finishing);

        // ── Colours from dedicated column OR text ─────────────────────────────────
        let parsedCols = parseColours(rawColor);
        if (!parsedCols) {
          // try spec/finishing text patterns like "4 Colour", "Single Colour"
          if (/4\s*[+ ]?\s*4/i.test(spec + ' ' + finishing)) parsedCols = { c1: 4, c2: 4 };
          else if (/4\s*[+ ]?\s*0/i.test(spec + ' ' + finishing)) parsedCols = { c1: 4, c2: 0 };
          else if (/1\s*[+ ]?\s*1/i.test(spec + ' ' + finishing)) parsedCols = { c1: 1, c2: 1 };
          else if (/1\s*[+ ]?\s*0/i.test(spec + ' ' + finishing)) parsedCols = { c1: 1, c2: 0 };
          else if (/4.*colou?r/i.test(spec + ' ' + finishing)) parsedCols = { c1: 4, c2: 0 };
          else if (/single.*colou?r|1.*colou?r/i.test(spec + ' ' + finishing)) parsedCols = { c1: 1, c2: 0 };
        }

        // ── Apply everything ──────────────────────────────────────────────────────
        const isA4 = /\ba4\b/i.test(combined);
        const isA3 = /\ba3\b/i.test(combined);

        if (BOOK(type)) {
          // PPS from ups column
          const ppsM = ups.match(/(\d+)\s*page/i) || ups.match(/(\d+)\s*pps/i) || ups.match(/(\d+)/);
          if (ppsM) { f.s0.pps = +ppsM[1]; if (f.s1) f.s1.pps = +ppsM[1]; }

          if (sm) {
            const pL = +sm[1], pW = +sm[2];
            const isFullMillSheet = (pL >= 18 && pW >= 22) || (pL * pW >= 350);
            if (isFullMillSheet) {
              f.s0.L = pL; f.s0.W = pW;
              if (f.s1) { f.s1.L = pL; f.s1.W = pW; }
            } else {
              f.s0.prodL = pL; f.s0.prodW = pW;
              const full0 = calcPaperSize(pL, pW, f.s0.pps || 16, false);
              f.s0.L = full0.L; f.s0.W = full0.W;
              if (f.s1) {
                f.s1.prodL = pL; f.s1.prodW = pW;
                const full1 = calcPaperSize(pL, pW, f.s1.pps || 16, false);
                f.s1.L = full1.L; f.s1.W = full1.W;
              }
            }
            // Enforce max 28 x 40
            if (Math.min(f.s0.L, f.s0.W) > 28 || Math.max(f.s0.L, f.s0.W) > 40) {
              if (f.s0.L >= f.s0.W) { f.s0.L = Math.min(f.s0.L, 40); f.s0.W = Math.min(f.s0.W, 28); }
              else { f.s0.W = Math.min(f.s0.W, 40); f.s0.L = Math.min(f.s0.L, 28); }
            }
            if (f.s1 && (Math.min(f.s1.L, f.s1.W) > 28 || Math.max(f.s1.L, f.s1.W) > 40)) {
              if (f.s1.L >= f.s1.W) { f.s1.L = Math.min(f.s1.L, 40); f.s1.W = Math.min(f.s1.W, 28); }
              else { f.s1.W = Math.min(f.s1.W, 40); f.s1.L = Math.min(f.s1.L, 28); }
            }
          }
          f.s0.gsm = detectedGSM;
          f.s0.paper = detectedPaper;
          f.s0.rate = S.rates[detectedPaper] ?? 58;
          if (parsedCols) { f.s0.c1 = parsedCols.c1; f.s0.c2 = parsedCols.c2; }

          // Pages from dedicated column or extracted from spec/name
          if (rawPages > 0) {
            f.s0.pages = rawPages;
          } else if (detectedPages > 0) {
            f.s0.pages = detectedPages;
          } else {
            // Try "N + M pages" pattern in spec
            const pgM = (spec + ' ' + finishing).match(/(\d+)\s*\+\s*(\d+)\s*pages?/i);
            if (pgM) { f.s0.pages = +pgM[1]; if (f.s1) f.s1.pages = +pgM[2]; }
          }

          // Register plates auto-calculated by forms
          if (type === 'multi') {
            const forms = Math.ceil((f.s0.pages || 100) / (f.s0.pps || 16));
            f.s0.plates = forms;
          }
        } else {
          // Single-sheet items: Letter, Envelope, Pads, Voucher
          const isEnvelope = type === 'envelope';

          // Specific user rules for standard A4 / A3 sizes:
          if (isEnvelope && isA4) {
            f.ups = 2;
            f.L = 20;
            f.W = 30;
          } else if (isEnvelope && isA3) {
            f.ups = 2;
            f.L = 25.59;
            f.W = 39.39;
          } else if (type === 'letter' && isA3) {
            f.ups = 4;
            f.L = 24;
            f.W = 34;
          } else if (type === 'letter' && isA4) {
            f.ups = 8;
            f.L = 24;
            f.W = 34;
          } else {
            // General sizing
            const upsM = ups.match(/(\d+)/);
            if (upsM) f.ups = +upsM[1];

            if (sm) {
              const pL = +sm[1], pW = +sm[2];
              const isFullMillSheet = (pL >= 18 && pW >= 22) || (pL * pW >= 350);
              if (isFullMillSheet) {
                f.L = pL; f.W = pW;
              } else {
                f.prodL = pL; f.prodW = pW;
                const full = calcPaperSize(pL, pW, f.ups || 1, isEnvelope);
                f.L = full.L; f.W = full.W;
                // If ups was not explicitly specified in tender column, take optimal calculated ups
                if (!upsM && full.ups) f.ups = full.ups;
              }
              // Enforce max 28 x 40
              if (Math.min(f.L, f.W) > 28 || Math.max(f.L, f.W) > 40) {
                if (f.L >= f.W) { f.L = Math.min(f.L, 40); f.W = Math.min(f.W, 28); }
                else { f.W = Math.min(f.W, 40); f.L = Math.min(f.L, 28); }
              }
            }
          }

          f.gsm = detectedGSM;
          f.paper = detectedPaper;
          f.rate = S.rates[detectedPaper] ?? 58;
          if (parsedCols) { f.c1 = parsedCols.c1; f.c2 = parsedCols.c2; }

          // Envelope punching rule
          if (type === 'envelope') {
            f.punchDie = f.ups <= 10 ? 1200 : 2100;
            f.punchRate = 150;
          }

          // VDP from finishing/spec
          const vdpText = spec + ' ' + finishing;
          if (/variable data|vdp|serial numb/i.test(vdpText) && !/not required/i.test(vdpText)) {
            f.vdp = S.vdpDefault;
          } else if (/vdp.*not required|variable.*not required/i.test(vdpText)) {
            f.vdp = 0;
          }

          // Envelope window detection
          if (type === 'envelope') {
            const winText = itemName + ' ' + spec + ' ' + finishing;
            if (/window|windowed/i.test(winText)) f.win = 100;
            else if (/without window|plain|non-window/i.test(winText)) f.win = 0;
          }

          // Lamination from finishing
          if (type === 'envelope' && /laminat/i.test(finishing)) {
            f.lam = 500; // default lamination rate if detected
          }

          // Numbering from finishing (pads/voucher)
          if ((type === 'pads' || type === 'voucher') && /number/i.test(finishing)) {
            f.num = S.vdpDefault;
          }

          // Print method: Cellback vs Front & Back (FrontBack)
          const methodText = (itemName + ' ' + spec + ' ' + finishing + ' ' + rawColor).toLowerCase();
          if (/front\s*(&|and)?\s*back|both\s*side|two\s*side|double\s*side/i.test(methodText)) {
            f.pmethod = 'frontback';
          } else {
            f.pmethod = 'cellback';
          }
          f.plates = calcPlates(f, type);
        }

        // Build the full spec string shown in the requirements row
        // Combine everything we know about this item
        const specParts = [];
        if (rawPaper) specParts.push(rawPaper);
        if (detectedGSM) specParts.push(detectedGSM + ' GSM');
        if (rawSize) specParts.push('Size: ' + rawSize);
        if (rawColor) specParts.push('Printing: ' + rawColor);
        if (rawPages) specParts.push('Pages: ' + rawPages);
        if (finishing) specParts.push(finishing);
        if (spec && spec !== finishing) specParts.push(spec);
        const fullSpec = specParts.filter(Boolean).join(' | ').trim() || spec;

        items.push({
          n: sr,
          co,
          cat,
          name: itemName,
          spec: fullSpec,
          uom,
          moq,
          annual,
          size: rawSize,
          ups,
          remarks: finishing,
          type,
          f,
          qty0: q,
          na,
          naWhy,
          row: i + 1
        });
      });

      cur = 0;
      renderList();
      renderDet();

      const costed = items.filter(i => !i.na);
      const naItems = items.filter(i => i.na);
      const countsByType = {};
      costed.forEach(i => {
        const t = TYPES[i.type] || i.type;
        countsByType[t] = (countsByType[t] || 0) + 1;
      });
      const typeBreakdown = Object.entries(countsByType).map(([k, v]) => `${v} ${k}`).join(', ');

      msg('bot', `Done! I studied ${items.length} items from ${filename}.\n• Costed: ${costed.length} (${typeBreakdown})\n• NA (Sample Required / Trading): ${naItems.length}\n• Auto-detected from your Excel: GSM, Paper Type, Printing Colours, Size, Pages, Finishing\n${S.divideBy12 ? '• Annual quantities were divided by 12 (Monthly) as default.' : '• Full annual quantities used.'}\n• Punching rule applied: ₹1,200 (UPS ≤ 10) / ₹2,100 (UPS > 10) + ₹150 / 1000 sheets.\n\nAll yellow cells are editable. White cells show live calculations!`);
    }

    async function onFile(file) {
      if (!file) return;
      msg('me', 'Uploaded file: ' + file.name);
      try {
        const buffer = await file.arrayBuffer();
        S.ab = buffer;
        const wb = XLSX.read(buffer, { type: 'array' });
        S.originalWb = wb;
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        loadBOQData(rows, file.name);
      } catch (err) {
        msg('bot', 'Error reading Excel file: ' + err.message);
      }
    }

    $('#drop').onclick = () => $('#file').click();
    $('#file').onchange = e => onFile(e.target.files[0]);
    $('#drop').ondragover = e => { e.preventDefault(); $('#drop').classList.add('dragover'); };
    $('#drop').ondragleave = () => $('#drop').classList.remove('dragover');
    $('#drop').ondrop = e => {
      e.preventDefault();
      $('#drop').classList.remove('dragover');
      if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
    };

    // --- CLIENT-SIDE FILE DOWNLOAD HELPER ---
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // --- HELPER TO BUILD EXCEL WORKSHEET EXACTLY MATCHING USER'S EXCEL STRUCTURE ---
    function buildCostingWorksheet(ws, it) {
      // Column widths matching 1_Big_Brown_Envelopes_costing.xlsx
      ws.columns = [
        { width: 44 }, // A: Particulars
        { width: 12 }, // B: Input 1
        { width: 12 }, // C: Input 2
        { width: 14 }, // D: Value / Calculation
        { width: 4 },  // E: 'x'
        { width: 14 }  // F: Size width
      ];

      // Row 1: Item Title
      const r1 = ws.addRow([it.name, '', '', '', '', '']);
      ws.mergeCells(`A1:F1`);
      r1.font = { bold: true, size: 16 };
      r1.alignment = { horizontal: 'center', vertical: 'middle' };
      r1.height = 30;

      // Row 2: Date
      const todayStr = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
      const r2 = ws.addRow([todayStr, '', '', '', '', '']);
      ws.mergeCells(`A2:F2`);
      r2.font = { bold: true, size: 12, color: { argb: 'FFFF0000' } };
      r2.alignment = { horizontal: 'center', vertical: 'middle' };
      r2.height = 20;

      if (it.na) {
        const r3 = ws.addRow(['Status', '', '', 'NA - ' + it.naWhy, '', '']);
        ws.mergeCells(`A3:C3`);
        ws.mergeCells(`D3:F3`);
        r3.getCell('D').font = { bold: true, color: { argb: 'FF77736A' } };
        return;
      }

      // Row 3: Requirements / Specification from the tender (always shown)
      if (it.spec) {
        const rSpec = ws.addRow(['Requirements / Specification: ' + it.spec, '', '', '', '', '']);
        const specRowNum = rSpec.number;
        ws.mergeCells(`A${specRowNum}:F${specRowNum}`);
        rSpec.height = Math.min(120, Math.max(30, Math.ceil(it.spec.length / 80) * 15));
        rSpec.getCell('A').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDEEAF1' } };
        rSpec.getCell('A').font = { size: 10, color: { argb: 'FF1A3A5C' } };
        rSpec.getCell('A').alignment = { horizontal: 'left', vertical: 'top', wrapText: true };
        ['A', 'B', 'C', 'D', 'E', 'F'].forEach(col => {
          rSpec.getCell(col).border = {
            top: { style: 'thin', color: { argb: 'FFB8D8F0' } },
            left: { style: 'thin', color: { argb: 'FFB8D8F0' } },
            bottom: { style: 'medium', color: { argb: 'FF6AABE8' } },
            right: { style: 'thin', color: { argb: 'FFB8D8F0' } }
          };
        });
      }

      const c = calc(it);
      const rowData = rows(it);

      const applyBorders = (row) => {
        ['A', 'B', 'C', 'D', 'E', 'F'].forEach(col => {
          row.getCell(col).border = {
            top: { style: 'thin', color: { argb: 'FFD9D9D9' } },
            left: { style: 'thin', color: { argb: 'FFD9D9D9' } },
            bottom: { style: 'thin', color: { argb: 'FFD9D9D9' } },
            right: { style: 'thin', color: { argb: 'FFD9D9D9' } }
          };
        });
      };

      rowData.forEach(r => {
        if (r.hd) {
          const hRow = ws.addRow([r.hd.toUpperCase(), '', '', '', '', '']);
          ws.mergeCells(`A${hRow.number}:F${hRow.number}`);
          hRow.font = { bold: true, size: 11, color: { argb: 'FFF5C542' } };
          hRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C1B18' } };
          applyBorders(hRow);
          return;
        }

        const rowNum = ws.lastRow ? ws.lastRow.number + 1 : 3;

        // Case 1: Paper Size (with Length x Width)
        if (r.isSize && r.vks) {
          const L = get(it.f, r.vks[0]);
          const W = get(it.f, r.vks[1]);
          const added = ws.addRow([r.l, '', '', L, 'x', W]);
          ws.mergeCells(`A${rowNum}:C${rowNum}`);
          applyBorders(added);
          added.getCell('D').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('D').alignment = { horizontal: 'center' };
          added.getCell('E').alignment = { horizontal: 'center' };
          added.getCell('F').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('F').alignment = { horizontal: 'center' };
          return;
        }

        // Case 2: Specification Paper Name
        if (r.sel) {
          const paperName = get(it.f, r.sel) || 'Maplitho';
          const added = ws.addRow([r.l, '', '', paperName, '', '']);
          ws.mergeCells(`A${rowNum}:C${rowNum}`);
          ws.mergeCells(`D${rowNum}:F${rowNum}`);
          applyBorders(added);
          added.getCell('D').alignment = { horizontal: 'center' };
          added.getCell('D').font = { bold: true };
          return;
        }

        // Case 3: Right-side editable inputs (GSM, Quantity, UPS, Paper Rate)
        if (r.isRight && r.ins) {
          const inputVal = get(it.f, r.ins[0]);
          const added = ws.addRow([r.l, '', '', inputVal, '', '']);
          ws.mergeCells(`A${rowNum}:C${rowNum}`);
          ws.mergeCells(`D${rowNum}:F${rowNum}`);
          applyBorders(added);
          added.getCell('D').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('D').alignment = { horizontal: 'center' };
          return;
        }

        // Case 4: Wastage row (B has percentage e.g. 0.03, D has wastage sheets)
        if (r.isWastageRow) {
          const pct = (get(it.f, 'wPct') || 3) / 100;
          const wasteSheets = c.waste;
          const added = ws.addRow([r.l, pct, '', wasteSheets, '', '']);
          ws.mergeCells(`B${rowNum}:C${rowNum}`);
          ws.mergeCells(`D${rowNum}:F${rowNum}`);
          applyBorders(added);
          added.getCell('B').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('B').alignment = { horizontal: 'center' };
          added.getCell('B').numFmt = '0.0%';
          added.getCell('D').alignment = { horizontal: 'right' };
          return;
        }

        // Case 5: Rows with 2 middle inputs (No. of Printing, Plate Cost, CPF)
        if (r.ins && r.ins.length >= 2) {
          const in1 = get(it.f, r.ins[0]);
          const in2 = get(it.f, r.ins[1]);
          const val = c[r.id] !== undefined ? +Number(c[r.id]).toFixed(r.d || 0) : '';
          const added = ws.addRow([r.l, in1, in2, val, '', '']);
          ws.mergeCells(`D${rowNum}:F${rowNum}`);
          applyBorders(added);
          added.getCell('B').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('B').alignment = { horizontal: 'center' };
          added.getCell('C').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('C').alignment = { horizontal: 'center' };
          added.getCell('D').alignment = { horizontal: 'right' };
          return;
        }

        // Case 6: Rows with 1 middle input (Printing, Making, Punching, Gumming, Window, Transp, Profit, Binding, Extra)
        if (r.ins && r.ins.length === 1) {
          let in1 = get(it.f, r.ins[0]);
          if (r.ins[0] === 'profit') in1 = in1 / 100;
          const val = c[r.id] !== undefined ? +Number(c[r.id]).toFixed(r.d || 0) : '';
          const added = ws.addRow([r.l, in1, '', val, '', '']);
          ws.mergeCells(`B${rowNum}:C${rowNum}`);
          ws.mergeCells(`D${rowNum}:F${rowNum}`);
          applyBorders(added);
          added.getCell('B').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
          added.getCell('B').alignment = { horizontal: 'center' };
          if (r.ins[0] === 'profit') added.getCell('B').numFmt = '0.0%';
          added.getCell('D').alignment = { horizontal: 'right' };
          return;
        }

        // Case 7: Pure calculated rows (Total Sheets, Required Sheets, Total Qty with Waste, Paper Weight, Paper Cost, Total Process Cost, Per Pcs Cost, Final Rate)
        const val = c[r.id] !== undefined ? +Number(c[r.id]).toFixed(r.d || 0) : '';
        const added = ws.addRow([r.l, '', '', val, '', '']);
        ws.mergeCells(`A${rowNum}:C${rowNum}`);
        ws.mergeCells(`D${rowNum}:F${rowNum}`);
        applyBorders(added);
        added.getCell('D').alignment = { horizontal: 'right' };

        if (r.cls === 'sub') {
          added.font = { bold: true };
          added.getCell('A').font = { bold: true };
          added.getCell('D').font = { bold: true };
        } else if (r.cls === 'green') {
          added.font = { bold: true };
          added.getCell('A').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' } };
          added.getCell('D').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' } };
          added.getCell('A').font = { bold: true };
          added.getCell('D').font = { bold: true };
        } else if (r.cls === 'final') {
          added.font = { bold: true, size: 12 };
          added.getCell('A').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC000' } };
          added.getCell('D').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC000' } };
          added.getCell('A').font = { bold: true };
          added.getCell('D').font = { bold: true };
        }
      });
    }

    // --- EXPORT CURRENT ITEM EXCEL ---
    async function exportCurrentItemExcel() {
      const it = cur_();
      if (!it) { alert('No item selected to export.'); return; }
      const cleanName = (it.name || 'item').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 30);
      const filename = `${it.n}_${cleanName}_costing.xlsx`;

      if (window.ExcelJS) {
        try {
          const wb = new ExcelJS.Workbook();
          wb.creator = 'Print Estimator';
          wb.created = new Date();
          const ws = wb.addWorksheet('Costing Sheet', { views: [{ showGridLines: true }] });
          buildCostingWorksheet(ws, it);

          const buffer = await wb.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          triggerDownload(blob, filename);
          msg('bot', `Exported Excel for "${it.name}" successfully showing every white calculation!`);
          return;
        } catch (err) {
          console.warn('ExcelJS export error, falling back to SheetJS', err);
        }
      }

      // Fallback to SheetJS
      const aoa = [[it.name], [new Date().toLocaleDateString('en-GB')]];
      rows(it).forEach(r => {
        if (r.hd) { aoa.push([r.hd.toUpperCase(), '', '', '']); return; }
        const c = calc(it);
        aoa.push([
          r.l,
          (r.ins || []).map(k => get(it.f, k)).join(', '),
          r.sel ? get(it.f, r.sel) : (r.vks || []).map(k => get(it.f, k)).join(' x '),
          r.id ? +Number(c[r.id]).toFixed(r.d || 0) : ''
        ]);
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Costing');
      const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      triggerDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), filename);
    }

    // --- EXPORT TENDER BOQ WORKBOOK ---
    async function exportTenderBOQExcel() {
      if (!items.length) {
        alert('No items loaded. Please upload a tender Excel file first.');
        return;
      }
      const filename = ($('#tn').textContent || 'BOQ_Tender') + '_costed.xlsx';

      if (window.ExcelJS) {
        try {
          const wb = new ExcelJS.Workbook();
          wb.creator = 'Print Estimator';

          // 1. BOQ Summary Sheet
          const wsBOQ = wb.addWorksheet('BOQ', { views: [{ showGridLines: true }] });
          const headers = ['Sr. No', 'Company Name', 'Catogery', 'Item', 'Specifications', 'UOM', 'MOQ', 'Estimated Annual Quantity', 'Rate', 'Tax', 'Paper Size', 'Ups', 'Remarks'];
          wsBOQ.addRow(headers);
          wsBOQ.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
          wsBOQ.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C1B18' } };
          wsBOQ.columns = [
            { width: 8 }, { width: 14 }, { width: 16 }, { width: 26 }, { width: 44 },
            { width: 10 }, { width: 10 }, { width: 16 }, { width: 12 }, { width: 8 },
            { width: 14 }, { width: 12 }, { width: 20 }
          ];

          items.forEach(it => {
            const rateVal = it.na ? 'NA' : +Number(calc(it).final).toFixed(2);
            const row = wsBOQ.addRow([
              it.n, it.co, it.cat, it.name, it.spec, it.uom, it.moq, it.annual, rateVal, it.tax || '', it.size, it.ups, it.remarks || ''
            ]);
            if (it.na) {
              row.getCell(9).alignment = { horizontal: 'center' };
              row.getCell(9).font = { color: { argb: 'FF77736A' }, bold: true };
            } else {
              row.getCell(9).alignment = { horizontal: 'right' };
              row.getCell(9).font = { bold: true };
              row.getCell(9).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2A8' } };
            }
          });

          // 2. Add individual sheets for all costed items
          items.filter(it => !it.na).forEach(it => {
            const sheetName = `${it.n} ${it.name}`.replace(/[:\\/?*\[\]]/g, '').substring(0, 28);
            const wsItem = wb.addWorksheet(sheetName, { views: [{ showGridLines: true }] });
            buildCostingWorksheet(wsItem, it);
          });

          const buffer = await wb.xlsx.writeBuffer();
          triggerDownload(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), filename);
          msg('bot', `Exported full tender workbook with BOQ rate column and ${items.filter(i => !i.na).length} detail costing sheets!`);
          return;
        } catch (err) {
          console.warn('ExcelJS export error, falling back to SheetJS', err);
        }
      }

      // Fallback to SheetJS
      const wb = XLSX.utils.book_new();
      const boqRows = [
        ['Sr. No', 'Company Name', 'Catogery', 'Item', 'Specifications', 'UOM', 'MOQ', 'Estimated Annual Quantity', 'Rate', 'Tax', 'Paper Size', 'Ups', 'Remarks']
      ];
      items.forEach(it => {
        boqRows.push([
          it.n, it.co, it.cat, it.name, it.spec, it.uom, it.moq, it.annual, it.na ? 'NA' : +Number(calc(it).final).toFixed(2), it.tax || '', it.size, it.ups, it.remarks || ''
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(boqRows), 'BOQ');
      const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      triggerDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), filename);
      msg('bot', `Exported BOQ with calculated rates.`);
    }

    $('#rates').oninput = e => {
      const v = parseFloat(e.target.value) || 0;
      if (e.target.dataset.p) S.rates[e.target.dataset.p] = v;
      if (e.target.dataset.g) S[e.target.dataset.g] = v;
    };

    $('#rates').onclick = e => {
      if (e.target.id === 'apall') {
        items.forEach(i => {
          [i.f, i.f.s0, i.f.s1].forEach(x => {
            if (x && x.paper && S.rates[x.paper]) x.rate = S.rates[x.paper];
            if (x && 'plateRate' in x) x.plateRate = S.plateRate;
            if (x && 'printRate' in x) x.printRate = S.printRate;
            if (x && 'transp' in x) x.transp = S.transportRate;
          });
          if ('wMin' in i.f) i.f.wMin = S.wMin;
          if ('wPct' in i.f) i.f.wPct = S.wPct;
        });
        renderList();
        renderDet();
        msg('bot', 'Global rates & defaults applied to all items!');
        tab(1);
      }
      if (e.target.id === 'rstRates') {
        S.rates = { 'Maplitho': 58, 'Art Paper Gloss': 76, 'Art Paper Matt': 76, 'Kraft Paper': 56, 'Board Paper': 70, 'Bond Paper': 72, 'Ledger Paper': 82 };
        S.plateRate = 500;
        S.printRate = 200;
        S.wMin = 250;
        S.wPct = 3;
        S.vdpDefault = 0.15;
        S.transportRate = 2.0;
        S.profitDefault = 15;
        renderRates();
        msg('bot', 'Defaults reset to factory values.');
      }
    };

      $('#t1').classList.toggle('on', n === 1);
      $('#t2').classList.toggle('on', n === 2);
      document.querySelectorAll('#main>section').forEach(s => {
        s.style.display = s.id === 'rates' ? (n === 2 ? 'block' : 'none') : (n === 1 ? '' : 'none');

      if (n === 2) renderRates();
    }

    function parseCSV(text) {
      const p = [];
      let row = [''];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          p.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') p.push(row);
      return p;
    }
